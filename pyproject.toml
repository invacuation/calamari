[project]
name = "calamari"
version = "0.2.1"
description = "Octopus Energy to Tado Energy IQ gas meter reading sync"
requires-python = ">=3.13"
dependencies = [
    "httpx>=0.28",
]

[project.scripts]
calamari = "calamari.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/calamari"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
src = ["src", "tests"]
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[dependency-groups]
dev = [
    "pytest>=8",
    "respx>=0.22",
    "ruff>=0.4",
]
